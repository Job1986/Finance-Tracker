<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance Tracker">
<meta name="theme-color" content="#ffffff">
<title>Finance Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
:root{--bg:#f5f5f7;--card:#fff;--border:#e5e5ea;--text:#1c1c1e;--text2:#6e6e73;--inc:#1D9E75;--exp:#D85A30;--r:14px;--rs:10px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#fff;--text2:#8e8e93}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:-apple-system,'Sarabun',sans-serif;color:var(--text)}
input,button{font-family:inherit;font-size:14px;outline:none}
input[type=text],input[type=number],input[type=date]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text)}
.app{max-width:430px;margin:0 auto;padding-bottom:90px}
.nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:.5px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);font-size:10px;transition:color .15s}
.nb i{font-size:22px}.nb.on{color:var(--inc)}
.pg{display:none;padding:16px 14px 0}.pg.on{display:block}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-top:8px}
.mbar button{background:var(--card);border:.5px solid var(--border);border-radius:var(--rs);padding:7px 13px;cursor:pointer;color:var(--text)}
.mn{font-size:17px;font-weight:600}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mc{background:var(--card);border-radius:var(--r);padding:14px}
.ml{font-size:12px;color:var(--text2);margin-bottom:5px}
.mv{font-size:22px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.st{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px 2px}
.txl{display:flex;flex-direction:column;gap:7px}
.txi{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--rs);padding:11px 12px}
.txico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.txin{flex:1;min-width:0}
.txn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txm{font-size:12px;color:var(--text2);margin-top:2px}
.txa{font-size:14px;font-weight:600;flex-shrink:0}
.txd{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;font-size:17px}
.emp{text-align:center;padding:36px 16px;color:var(--text2);font-size:14px;line-height:1.8}
.emp i{font-size:36px;display:block;margin-bottom:10px;opacity:.5}
.pw{height:170px;position:relative}
.cr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)}
.cr:last-child{border-bottom:none}
.cd{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.fab{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));right:20px;width:54px;height:54px;border-radius:50%;background:var(--inc);color:#fff;border:none;font-size:32px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(29,158,117,.4);z-index:99;line-height:1}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{font-size:17px;font-weight:600}
.cb{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tb{padding:11px;border:1px solid var(--border);border-radius:var(--rs);background:none;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.tb.ai{background:#e8f9f3;color:#0b6349;border-color:var(--inc)}
.tb.ae{background:#fceee9;color:#8c3218;border-color:var(--exp)}
.fg{margin-bottom:14px}.fg label{font-size:13px;color:var(--text2);display:block;margin-bottom:6px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.catb{padding:9px 8px;border:1px solid var(--border);border-radius:var(--rs);background:none;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .15s}
.catb.on{background:var(--bg);border-color:var(--text);color:var(--text);font-weight:500}
.sb{border:1.5px dashed var(--border);border-radius:var(--rs);padding:20px;text-align:center;cursor:pointer;position:relative;overflow:hidden;margin-bottom:14px;background:var(--bg)}
.sb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sb i{font-size:30px;color:var(--text2);display:block;margin-bottom:6px}
.sb p{font-size:13px;color:var(--text2);line-height:1.5}
.ss{font-size:13px;padding:10px 12px;border-radius:var(--rs);margin-bottom:12px;display:none}
.ss.ld{background:#e8f9f3;color:#0b6349;display:block}
.ss.ok{background:#e8f9f3;color:#0b6349;display:block}
.ss.er{background:#fceee9;color:#8c3218;display:block}
.sub{width:100%;padding:14px;background:var(--inc);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.hi{padding:12px 0;border-bottom:.5px solid var(--border)}.hi:last-child{border-bottom:none}
.ht{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.hm{font-size:15px;font-weight:500}.hb{font-size:14px;font-weight:600}
.prog-wrap{background:#e5e5ea;border-radius:999px;height:6px;margin:6px 0 2px;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:var(--inc);transition:width .3s}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:500;align-items:center;justify-content:center}
.loading-overlay.on{display:flex}
.loading-box{background:var(--card);border-radius:var(--r);padding:24px 32px;text-align:center;font-size:14px;color:var(--text2)}
.loading-box i{font-size:32px;display:block;margin-bottom:10px;color:var(--inc)}
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><i class="ti ti-loader"></i>กำลังโหลดข้อมูล...</div>
</div>

<div class="app">
  <nav class="nav">
    <button class="nb on" onclick="showPg('dash',this)"><i class="ti ti-layout-dashboard"></i>ภาพรวม</button>
    <button class="nb" onclick="showPg('txs',this)"><i class="ti ti-list"></i>รายการ</button>
    <button class="nb" onclick="showPg('cats',this)"><i class="ti ti-chart-pie"></i>หมวดหมู่</button>
    <button class="nb" onclick="showPg('hist',this)"><i class="ti ti-calendar-stats"></i>ประวัติ</button>
  </nav>

  <div id="pg-dash" class="pg on">
    <div class="mbar">
      <button onclick="chgM(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="mn" id="ml1"></span>
      <button onclick="chgM(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="mg">
      <div class="mc"><div class="ml">รายรับ</div><div class="mv" id="ti" style="color:var(--inc)">฿0</div></div>
      <div class="mc"><div class="ml">รายจ่าย</div><div class="mv" id="te" style="color:var(--exp)">฿0</div></div>
    </div>
    <div class="mc" style="margin-bottom:12px"><div class="ml">คงเหลือ</div><div class="mv" id="tb">฿0</div></div>
    <div class="st">6 เดือนล่าสุด</div>
    <div class="card">
      <div style="position:relative;height:180px"><canvas id="barC"></canvas></div>
      <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text2)">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:#1D9E75;flex-shrink:0"></span>รายรับ</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:#D85A30;flex-shrink:0"></span>รายจ่าย</span>
      </div>
    </div>
    <div class="st">รายการล่าสุด</div>
    <div id="rl" class="txl"></div>
  </div>

  <div id="pg-txs" class="pg">
    <div class="mbar">
      <button onclick="chgM(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="mn" id="ml2"></span>
      <button onclick="chgM(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div id="txl" class="txl"></div>
    <div id="txe" class="emp" style="display:none"><i class="ti ti-receipt-off"></i>ยังไม่มีรายการเดือนนี้<br>กด + เพื่อเพิ่มรายการ</div>
  </div>

  <div id="pg-cats" class="pg">
    <div class="mbar">
      <button onclick="chgM(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="mn" id="ml3"></span>
      <button onclick="chgM(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="st">สัดส่วนรายจ่าย</div>
    <div class="card"><div class="pw"><canvas id="pieC"></canvas></div></div>
    <div class="card" id="catd"></div>
  </div>

  <div id="pg-hist" class="pg">
    <div class="st">ประวัติทุกเดือน</div>
    <div class="card" id="histl"></div>
  </div>
</div>

<button class="fab" onclick="openM()">+</button>

<div class="mbg" id="modal">
  <div class="modal">
    <div class="mh"><span class="mt">เพิ่มรายการ</span><button class="cb" onclick="closeM()">✕</button></div>
    <div class="tr">
      <button class="tb ai" id="bi" onclick="setT('income')"><i class="ti ti-trending-up"></i> รายรับ</button>
      <button class="tb" id="be" onclick="setT('expense')"><i class="ti ti-trending-down"></i> รายจ่าย</button>
    </div>
    <div class="sb">
      <input type="file" accept="image/*" id="rf" onchange="doScan(event)">
      <i class="ti ti-camera"></i>
      <p>แตะเพื่ออัพโหลดใบเสร็จ / ถ่ายรูป<br><small style="opacity:.6">Tesseract OCR — ประมวลผลบนเครื่อง ปลอดภัย 100%</small></p>
    </div>
    <div class="ss" id="ss"></div>
    <div id="ocrProg" style="display:none;margin-bottom:14px">
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px" id="ocrProgTxt">กำลังโหลด OCR...</div>
      <div class="prog-wrap"><div class="prog-fill" id="ocrProgBar" style="width:0%"></div></div>
    </div>
    <div class="fg"><label>ชื่อรายการ</label><input type="text" id="in" placeholder="เช่น ข้าวกะเพรา, 7-Eleven"></div>
    <div class="fg"><label>จำนวนเงิน (฿)</label><input type="number" id="ia" placeholder="0.00" min="0" step="0.01"></div>
    <div class="fg"><label>วันที่</label><input type="date" id="id"></div>
    <div class="fg"><label>หมวดหมู่</label><div class="cg" id="cg"></div></div>
    <div class="fg" id="cfg" style="display:none"><label>ระบุหมวดหมู่</label><input type="text" id="ic" placeholder="พิมพ์หมวดหมู่"></div>
    <button class="sub" onclick="addTx()">บันทึกรายการ</button>
  </div>
</div>

<script>
// ===== SUPABASE CONFIG =====
var SB_URL = 'https://ljqsgtvjyobqlr.supabase.co';
var SB_KEY = 'sb_publishable_Jfn_zZ1924N2mgD5IplvXw_Ama8AXIT';

var CE=[{id:'food',label:'อาหาร/เครื่องดื่ม',icon:'ti-bowl',color:'#1D9E75'},{id:'shop',label:'ช้อปปิ้ง',icon:'ti-shopping-bag',color:'#378ADD'},{id:'entertain',label:'บันเทิง',icon:'ti-confetti',color:'#BA7517'},{id:'other',label:'อื่นๆ',icon:'ti-dots',color:'#888780'}];
var CI=[{id:'salary',label:'เงินเดือน',icon:'ti-briefcase',color:'#534AB7'},{id:'bonus',label:'โบนัส',icon:'ti-gift',color:'#D4537E'},{id:'freelance',label:'ฟรีแลนซ์',icon:'ti-device-laptop',color:'#0F6E56'},{id:'other',label:'อื่นๆ',icon:'ti-dots',color:'#888780'}];

var curType='income', selCat='salary', curDate=new Date();
var barInst=null, pieInst=null;
var allTxs=[];

var MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ml(d){return MN[d.getMonth()]+' '+(d.getFullYear()+543)}
function fmt(n){return'฿'+Math.round(Math.abs(Number(n))).toLocaleString('th-TH')}
function gc(type,id){var l=type==='income'?CI:CE;return l.find(function(c){return c.id===id})||{label:id,icon:'ti-circle',color:'#888780'}}

// ===== SUPABASE API =====
async function sbFetch(path, method, body){
  var opts = {
    method: method||'GET',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': method==='POST'?'return=representation':''
    }
  };
  if(body) opts.body = JSON.stringify(body);
  var res = await fetch(SB_URL+'/rest/v1/'+path, opts);
  if(!res.ok){ var e=await res.text(); throw new Error(e); }
  var txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

async function loadTxs(){
  showLoading(true);
  try{
    var rows = await sbFetch('transactions?select=*&order=date.desc');
    allTxs = rows;
  }catch(e){
    console.error(e);
    allTxs = [];
  }
  showLoading(false);
}

async function insertTx(tx){
  await sbFetch('transactions', 'POST', tx);
}

async function deleteTxDB(id){
  await sbFetch('transactions?id=eq.'+id, 'DELETE');
}

function showLoading(v){
  document.getElementById('loadingOverlay').className = 'loading-overlay'+(v?' on':'');
}

// ===== HELPERS =====
function getTxsByMonth(key){
  return allTxs.filter(function(t){
    return t.date && t.date.substring(0,7)===key;
  }).sort(function(a,b){return new Date(b.date)-new Date(a.date)});
}

function txHTML(tx,del){
  var cat=gc(tx.type,tx.cat);
  var sign=tx.type==='income'?'+':'-';
  return '<div class="txi">'+
    '<div class="txico" style="background:'+cat.color+'22"><i class="ti '+cat.icon+'" style="color:'+cat.color+'"></i></div>'+
    '<div class="txin"><div class="txn">'+tx.name+'</div><div class="txm">'+cat.label+' · '+tx.date+'</div></div>'+
    '<div class="txa" style="color:'+(tx.type==='income'?'var(--inc)':'var(--exp)')+'">'+sign+fmt(tx.amount)+'</div>'+
    (del?'<button class="txd" onclick="delTx(\''+tx.id+'\')"><i class="ti ti-trash"></i></button>':'')+
  '</div>';
}

function destroyChart(inst){if(inst){try{inst.destroy()}catch(e){}}return null}

function refresh(){
  var key=mk(curDate);
  var txs=getTxsByMonth(key);
  var inc=txs.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+Number(t.amount)},0);
  var exp=txs.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+Number(t.amount)},0);
  var bal=inc-exp;

  ['ml1','ml2','ml3'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=ml(curDate)});
  document.getElementById('ti').textContent=fmt(inc);
  document.getElementById('te').textContent=fmt(exp);
  var tb=document.getElementById('tb');
  tb.textContent=(bal<0?'-':'')+fmt(bal);
  tb.style.color=bal>=0?'var(--inc)':'var(--exp)';

  var rl=document.getElementById('rl');
  rl.innerHTML=txs.length?txs.slice(0,5).map(function(t){return txHTML(t,false)}).join(''):'<div class="emp"><i class="ti ti-clock"></i>ยังไม่มีรายการ</div>';

  var txl=document.getElementById('txl');
  var txe=document.getElementById('txe');
  if(txs.length){txl.innerHTML=txs.map(function(t){return txHTML(t,true)}).join('');txe.style.display='none'}
  else{txl.innerHTML='';txe.style.display='block'}

  // Bar chart
  barInst=destroyChart(barInst);
  var incA=[],expA=[],lblA=[];
  for(var i=5;i>=0;i--){
    var d=new Date(curDate.getFullYear(),curDate.getMonth()-i,1);
    var k2=mk(d);
    var mt=getTxsByMonth(k2);
    incA.push(mt.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+Number(t.amount)},0));
    expA.push(mt.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+Number(t.amount)},0));
    lblA.push(MN[d.getMonth()]);
  }
  var bc=document.getElementById('barC');
  if(bc&&window.Chart){
    barInst=new Chart(bc,{type:'bar',data:{labels:lblA,datasets:[
      {label:'รายรับ',data:incA,backgroundColor:'#1D9E75',borderRadius:4},
      {label:'รายจ่าย',data:expA,backgroundColor:'#D85A30',borderRadius:4}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:'rgba(128,128,128,.08)'},ticks:{callback:function(v){return'฿'+v.toLocaleString()}}}}}});
  }

  // Pie
  pieInst=destroyChart(pieInst);
  var expTxs=txs.filter(function(t){return t.type==='expense'});
  var cm={};
  expTxs.forEach(function(t){cm[t.cat]=(cm[t.cat]||0)+Number(t.amount)});
  var ck=Object.keys(cm);
  var pc=document.getElementById('pieC');
  if(pc&&ck.length&&window.Chart){
    pieInst=new Chart(pc,{type:'doughnut',data:{labels:ck.map(function(k){return gc('expense',k).label}),datasets:[{
      data:ck.map(function(k){return cm[k]}),backgroundColor:ck.map(function(k){return gc('expense',k).color}),borderWidth:2
    }]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false}}}});
    var total=ck.reduce(function(s,k){return s+cm[k]},0);
    document.getElementById('catd').innerHTML=ck.sort(function(a,b){return cm[b]-cm[a]}).map(function(k){
      var cat=gc('expense',k);var pct=total?Math.round(cm[k]/total*100):0;
      return '<div class="cr"><span class="cd" style="background:'+cat.color+'"></span>'+
        '<span style="flex:1;font-size:14px">'+cat.label+'</span>'+
        '<span style="font-size:13px;color:var(--text2);margin-right:8px">'+pct+'%</span>'+
        '<span style="font-size:14px;font-weight:500">'+fmt(cm[k])+'</span></div>';
    }).join('');
  } else if(pc){
    document.getElementById('catd').innerHTML='<div class="emp"><i class="ti ti-chart-pie-off"></i>ยังไม่มีรายจ่ายเดือนนี้</div>';
  }

  // History
  var months={};
  allTxs.forEach(function(t){var k=t.date.substring(0,7);if(!months[k])months[k]=[];months[k].push(t)});
  var allK=Object.keys(months).sort().reverse();
  var hl=document.getElementById('histl');
  if(!allK.length){hl.innerHTML='<div class="emp"><i class="ti ti-history"></i>ยังไม่มีข้อมูล</div>';return}
  hl.innerHTML=allK.map(function(k){
    var mt=months[k];
    var i2=mt.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+Number(t.amount)},0);
    var e2=mt.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+Number(t.amount)},0);
    var b2=i2-e2;
    var parts=k.split('-');
    var d2=new Date(parts[0],parseInt(parts[1])-1,1);
    return '<div class="hi"><div class="ht"><span class="hm">'+ml(d2)+'</span>'+
      '<span class="hb" style="color:'+(b2>=0?'var(--inc)':'var(--exp)')+'">'+
      (b2>=0?'+':'-')+fmt(b2)+'</span></div>'+
      '<div style="display:flex;gap:14px;font-size:12px;color:var(--text2)">'+
      '<span style="color:var(--inc)">รับ '+fmt(i2)+'</span>'+
      '<span style="color:var(--exp)">จ่าย '+fmt(e2)+'</span>'+
      '<span>'+mt.length+' รายการ</span></div></div>';
  }).join('');
}

function showPg(id,btn){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});
  document.getElementById('pg-'+id).classList.add('on');
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  refresh();
}

function chgM(d){curDate=new Date(curDate.getFullYear(),curDate.getMonth()+d,1);refresh()}

function openM(){
  document.getElementById('modal').classList.add('on');
  document.getElementById('id').value=new Date().toISOString().split('T')[0];
  document.getElementById('in').value='';
  document.getElementById('ia').value='';
  document.getElementById('ss').className='ss';
  document.getElementById('ss').textContent='';
  document.getElementById('rf').value='';
  document.getElementById('ocrProg').style.display='none';
  setT('income');
}
function closeM(){document.getElementById('modal').classList.remove('on')}
function setT(t){
  curType=t;
  document.getElementById('bi').className='tb'+(t==='income'?' ai':'');
  document.getElementById('be').className='tb'+(t==='expense'?' ae':'');
  renderCats();
}
function renderCats(){
  var cats=curType==='income'?CI:CE;selCat=cats[0].id;
  document.getElementById('cg').innerHTML=cats.map(function(c){
    return '<button class="catb'+(c.id===selCat?' on':'')+'" onclick="selC(\''+c.id+'\',this)">'+
      '<i class="ti '+c.icon+'" style="color:'+c.color+'"></i>'+c.label+'</button>';
  }).join('');
  document.getElementById('cfg').style.display='none';
}
function selC(id,el){
  selCat=id;
  document.querySelectorAll('.catb').forEach(function(b){b.classList.remove('on')});
  el.classList.add('on');
  document.getElementById('cfg').style.display=id==='other'?'block':'none';
}

async function addTx(){
  var name=document.getElementById('in').value.trim();
  var amount=parseFloat(document.getElementById('ia').value);
  var date=document.getElementById('id').value;
  var cat=selCat;
  if(cat==='other'){var cc=document.getElementById('ic').value.trim();if(cc)cat=cc}
  if(!name||!amount||!date||amount<=0){alert('กรุณากรอกข้อมูลให้ครบ');return}
  var tx={id:Date.now().toString(),type:curType,name:name,amount:amount,date:date,cat:cat};
  showLoading(true);
  try{
    await insertTx(tx);
    allTxs.unshift(tx);
    closeM();
    curDate=new Date(date.replace(/-/g,'/'));
    curDate=new Date(curDate.getFullYear(),curDate.getMonth(),1);
    refresh();
  }catch(e){
    alert('บันทึกไม่สำเร็จ: '+e.message);
  }
  showLoading(false);
}

async function delTx(id){
  if(!confirm('ลบรายการนี้?'))return;
  showLoading(true);
  try{
    await deleteTxDB(id);
    allTxs=allTxs.filter(function(t){return t.id!==id});
    refresh();
  }catch(e){
    alert('ลบไม่สำเร็จ: '+e.message);
  }
  showLoading(false);
}

// ===== OCR =====
function extractAmount(text){
  var patterns=[
    /(?:total|รวม|ยอดรวม|สุทธิ|grand\s*total)[^\d]*(\d[\d,]*\.?\d*)/gi,
    /(\d[\d,]*\.\d{2})/gi,
    /(?:฿|thb)\s*(\d[\d,]*\.?\d*)/gi
  ];
  var found=[];
  for(var i=0;i<patterns.length;i++){
    var m;var re=patterns[i];re.lastIndex=0;
    while((m=re.exec(text))!==null){var n=parseFloat(m[1].replace(/,/g,''));if(n>0&&n<1000000)found.push(n)}
    if(i===0&&found.length>0)break;
  }
  if(!found.length)return null;
  return found.sort(function(a,b){return b-a})[0];
}
function extractName(text){
  var lines=text.split('\n').map(function(l){return l.trim()}).filter(function(l){return l.length>2});
  for(var i=0;i<Math.min(5,lines.length);i++){
    if(!/^[\d\s\.,\-\/\*]+$/.test(lines[i])&&lines[i].length>2)return lines[i].substring(0,40);
  }
  return lines[0]?lines[0].substring(0,40):'';
}
async function doScan(e){
  var file=e.target.files[0];if(!file)return;
  var ss=document.getElementById('ss');
  var prog=document.getElementById('ocrProg');
  var progBar=document.getElementById('ocrProgBar');
  var progTxt=document.getElementById('ocrProgTxt');
  ss.className='ss';ss.textContent='';
  prog.style.display='block';progBar.style.width='5%';
  progTxt.textContent='กำลังโหลด Tesseract OCR...';
  try{
    if(!window.Tesseract){
      await new Promise(function(res,rej){
        var s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload=res;s.onerror=rej;document.head.appendChild(s);
      });
    }
    progBar.style.width='20%';progTxt.textContent='กำลังวิเคราะห์รูปภาพ...';
    var result=await Tesseract.recognize(file,'tha+eng',{
      logger:function(m){
        if(m.status==='recognizing text'){
          var pct=20+Math.round(m.progress*70);
          progBar.style.width=pct+'%';
          progTxt.textContent='กำลังอ่านตัวอักษร... '+Math.round(m.progress*100)+'%';
        }
      }
    });
    progBar.style.width='100%';progTxt.textContent='เสร็จแล้ว!';
    var text=result.data.text;
    var amount=extractAmount(text);
    var name=extractName(text);
    if(name)document.getElementById('in').value=name;
    if(amount)document.getElementById('ia').value=amount;
    setT('expense');
    setTimeout(function(){prog.style.display='none'},500);
    if(name||amount){
      ss.className='ss ok';
      ss.innerHTML='<i class="ti ti-check"></i> อ่านสำเร็จ'+(name?' ชื่อ: <strong>'+name+'</strong>':'')+(amount?' ฿'+amount:'')+'<br><small style="opacity:.7">ตรวจสอบและแก้ไขได้ก่อนบันทึก</small>';
    }else{ss.className='ss er';ss.textContent='อ่านตัวเลขไม่ได้ กรุณากรอกเอง'}
  }catch(err){prog.style.display='none';ss.className='ss er';ss.textContent='เกิดข้อผิดพลาด: '+err.message}
}
